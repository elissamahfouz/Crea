<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - My Clay Creations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div id="logo-placeholder">
            <!-- Logo will go here -->
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="cart.html" id="cart-status">Cart (0)</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Our Products</h1>
        <div id="product-list-container">
            <div class="product-item">
                <!-- Product Image -->
                <img src="placeholder.jpg" alt="Product Image Placeholder">
                <h3>Product Name 1</h3>
                <p>Short description of product 1.</p>
                <p class="price">$19.99</p>
                <button class="add-to-cart-btn" data-product-name="Product Name 1" data-product-price="19.99">Add to Cart</button>
            </div>
            <div class="product-item">
                <!-- Product Image -->
                <img src="placeholder.jpg" alt="Product Image Placeholder">
                <h3>Product Name 2</h3>
                <p>Short description of product 2.</p>
                <p class="price">$24.99</p>
                <button class="add-to-cart-btn" data-product-name="Product Name 2" data-product-price="24.99">Add to Cart</button>
            </div>
            <div class="product-item">
                <!-- Product Image -->
                <img src="placeholder.jpg" alt="Product Image Placeholder">
                <h3>Product Name 3</h3>
                <p>Short description of product 3.</p>
                <p class="price">$29.99</p>
                <button class="add-to-cart-btn" data-product-name="Product Name 3" data-product-price="29.99">Add to Cart</button>
            </div>
            <!-- More products can be added here -->
        </div>
    </main>

    <footer>
        <p>&copy; 2023 My Clay Creations</p>
    </footer>
    <script src="script.js" defer></script>
</body>
</html>
