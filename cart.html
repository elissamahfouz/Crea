<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - My Clay Creations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div id="logo-placeholder">
            <!-- Logo will go here -->
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="cart.html" id="cart-status">Cart (0)</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Your Shopping Cart</h1>
        
        <!-- Container for dynamically generated cart items -->
        <div id="cart-items-container">
            <p>Your cart is currently empty.</p>
            <!-- Example of how a cart item might look (to be generated by script.js)
            <div class="cart-item">
                <p>Product Name</p>
                <p>Quantity: 1</p>
                <p>Price: $19.99</p>
                <button class="remove-item-btn" data-product-name="Product Name">Remove</button>
            </div>
            -->
        </div>

        <!-- Section for displaying the cart total -->
        <div id="cart-summary">
            <h3>Cart Total</h3>
            <p>Total: <span id="cart-total-price">$0.00</span></p>
        </div>

        <!-- Section for cart action buttons -->
        <div class="cart-actions">
            <a href="products.html"><button>Continue Shopping</button></a>
            <button id="checkout-btn">Proceed to Checkout</button>
            <!-- The "Proceed to Checkout" button is a placeholder for future payment integration -->
        </div>
    </main>

    <footer>
        <p>&copy; 2023 My Clay Creations</p>
    </footer>
    <!-- Link to script.js if cart display/manipulation on this page needs it -->
    <!-- <script src="script.js" defer></script> --> 
</body>
</html>
